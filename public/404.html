<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>I Told You So</title>
    <script>
      // The app uses hash routes (#/…), so any other path is a stale link.
      // Send it to the app root: /<repo>/ on project pages, / on a custom domain.
      var seg = location.pathname.split('/')[1];
      var target = seg ? '/' + seg + '/' : '/';
      if (target === location.pathname) target = '/';
      location.replace(target);
    </script>
  </head>
  <body></body>
</html>
